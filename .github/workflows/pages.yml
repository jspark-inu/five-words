# main에 올리면 시험을 돌리고 dist/index.html을 만들어 GitHub Pages에 올린다.
name: 웹에 올리기
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # 시험 중 하나(빌드 결과물 검사)가 dist/index.html을 읽으므로 먼저 만든다
      # 가상 학생 시험이 무거워서, 작은 GitHub 컴퓨터에서는 파일을 하나씩 돌린다(동시에 돌리면 시험 도구의 연락이 시간 초과로 끊긴다).
      - run: npx vitest run --no-file-parallelism
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
